<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beheer · Brandrisicoscan</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header><img src="/logo.png" alt="Aqua+"><h1>Brandrisicoscan · Beheer</h1></header>
<main>
  <form class="kaart smal" method="post" action="/admin/wachtwoord">
    <p class="zacht">Ingelogd met Microsoft als <b>{{email}}</b>. Vul ook het beheerwachtwoord in.</p>
    <div class="fout">{{fout}}</div>
    <label for="ww">Beheerwachtwoord</label>
    <input id="ww" name="wachtwoord" type="password" autocomplete="current-password" required autofocus>
    <button class="btn" type="submit">Verder</button>
  </form>
</main>
</body>
</html>
